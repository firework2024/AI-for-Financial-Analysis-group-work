# 宝塔 Nginx 站点配置：pkufinagent.site → FinAgent (127.0.0.1:8765)
# 部署路径（服务器）: /www/server/panel/vhost/nginx/pkufinagent.conf
# 证书路径（Let's Encrypt / 宝塔）:
#   /www/server/panel/vhost/cert/pkufinagent.site/fullchain.pem
#   /www/server/panel/vhost/cert/pkufinagent.site/privkey.pem
#
# 部署后执行:
#   chmod 600 /www/server/panel/vhost/cert/pkufinagent.site/privkey.pem
#   /www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload

server {
    listen 80;
    server_name pkufinagent.site www.pkufinagent.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pkufinagent.site www.pkufinagent.site;

    ssl_certificate     /www/server/panel/vhost/cert/pkufinagent.site/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pkufinagent.site/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
