[project]
name = "finagent"
version = "0.1.0"
description = "Annual-report centered financial analysis workflow for A-share companies."
requires-python = ">=3.10"
dependencies = [
  "requests",
  "pandas",
  "PyMuPDF",
  "rqdatac",
  "openai",
  "matplotlib",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
]

[tool.setuptools.packages.find]
include = ["finagent*"]
exclude = ["annual_reports*", "outputs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
